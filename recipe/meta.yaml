{% set name = "prefect" %}
{% set version = "3.9.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7f394f40d1d170909023e408cb6207aa11607f075d275ebab4ee472cd7d90a5a

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - prefect = prefect.cli:app

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
    - versioningit
  run:
    - python >={{ python_min }},<3.16
    - aiosqlite >=0.17.0,<1.0.0
    - alembic >=1.7.5,<2.0.0
    - amplitude-analytics >=1.2.1,<2.0.0
    - anyio >=4.4.0,<5.0.0
    - apprise >=1.13.0,<2.1.0
    - asgi-lifespan >=1.0,<3.0
    - asyncpg >=0.23,<1.0.0
    - cachetools >=5.3,<8.0
    - certifi >=2026.10.19
    - click >=8.0,<9
    - cloudpickle >=2.0,<4.0
    - coolname >=1.0.4,<6.0.0
    - cryptography >=36.0.1
    - cyclopts >=4.8.0
    - dateparser >=1.1.1,<2.0.0
    - docker-py >=4.0,<8.0
    - exceptiongroup >=1.0.0
    - fastapi >=0.139.0,<0.151
    - fsspec >=2022.5.0
    - python-graphviz >=0.20.1
    - griffe >=0.49.0,<3.0.0
    - h2 >=3,<5
    - httpcore >=1.0.5,<2.0.0
    - httpx >=0.23,!=0.23.2
    - humanize >=4.9.0,<5.0.0
    - jinja2 >=3.1.6,<4.0.0
    - jinja2-humanize-extension >=0.4.0
    - jsonpatch >=1.32,<2.0
    - jsonschema >=4.18.0,<5.0.0
    - opentelemetry-api >=1.27.0,<2.0.0
    - orjson >=3.7,<4.0
    - packaging >=21.3,<27
    - pathspec >=0.10.1
    - pendulum >=3.1.0,<4
    - pluggy >=1.6.0
    - prometheus_client >=0.20.0
    - pydantic >=2.10.1,<3.0.0,!=2.11.0,!=2.11.1,!=2.11.2,!=2.11.3,!=2.11.4
    - pydantic-core >=2.12.0,<3.0.0
    - pydantic-extra-types >=2.8.2,<3.0.0
    - pydantic-settings >=2.9.1,<3.0.0
    - pydocket >=0.27.2
    - python-dateutil >=2.8.2,<3.0.0
    - python-slugify >=9,<9.2
    - pytz >=2021.1,<2027
    - pyyaml >=5.4.1,<7.0.0
    - readchar >=4.0.0,<5.0.0
    - rfc3339-validator >=0.1.4,<0.2.0
    - rich >=11.0,<16.0
    - ruamel.yaml >=0.17.0,!=0.19.0
    - semver >=3.0.4
    - sniffio >=1.3.0,<2.0.0
    - sqlalchemy-with-asyncio >=2.0,<3.0.0
    - starlette >=1.0.1
    - toml >=0.10.0
    - typing_extensions >=4.10.0,<5.0.0
    - uvicorn >=0.14.0,!=0.29.0
    - websockets >=15.0.1,<17.0
    - whenever >=0.10.5,<0.12.0

test:
  imports:
    - prefect
    - prefect.cli
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
    # Check that the entrypoint is configured
    - prefect --help
    # Check that the long-form version command works (this uses a database and client)
    - prefect version
    # Check that the version is correct
    - sh -c '[ "$(prefect --version)" = "{{ version }}" ]'

about:
  home: https://github.com/PrefectHQ/prefect
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: 'The Prefect Core automation engine '
  description: |
    Prefect is a workflow management system, designed for modern infrastructure
    and powered by the open-source Prefect Core workflow engine.
    Users organize `Tasks` into `Flows`, and Prefect takes care of the rest.
  doc_url: https://docs.prefect.io/

extra:
  recipe-maintainers:
    - zzstoatzz
    - cicdw
    - desertaxle
